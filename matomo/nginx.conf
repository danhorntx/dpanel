# nginx config for the matomo-web container. Serves static assets directly
# from the shared /var/www/html volume and forwards PHP to matomo-app via
# FastCGI. Cribbed from the upstream Matomo docker example, tightened for
# this single-tenant deployment.

server {
    listen 80 default_server;
    server_name _;

    root  /var/www/html;
    index index.php;

    # The php-fpm container expects no leading prefix on the script path.
    location ~ ^/(index|matomo|piwik|js/index)\.php {
        fastcgi_pass            matomo-app:9000;
        fastcgi_index           index.php;
        include                 fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;   # honored via Apache X-Forwarded-Proto
    }

    # Deny direct access to PHP files outside the allow-list above.
    location ~ \.php$ {
        return 404;
    }

    # Static assets — long-cache, served by nginx directly.
    location ~* \.(gif|ico|jpg|png|svg|js|css)$ {
        expires    1h;
        add_header Cache-Control "public";
        try_files  $uri =404;
    }

    # JS tracker file paths (matomo.js / piwik.js) — short cache to pick up
    # plugin changes within an hour without invalidating client cache too
    # often. The path-obfuscation Apache rewrite (in the analytics.* vhost)
    # exposes these as /cdn/script.js publicly.
    location ~ ^/(matomo|piwik)\.js$ {
        expires    1h;
        add_header Cache-Control "public, must-revalidate";
        try_files  $uri =404;
    }

    # Block sensitive paths from being served as static files.
    location ~ ^/(config|tmp|core|lang)/ { return 403; }
    location ~ /\.ht                     { return 403; }

    # SPA fallback for everything else.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
